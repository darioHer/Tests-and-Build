name: Test and Build

on: # cuando se ejecuta el workflow
  push:
    branches: [ "main" ]

# workflow pueda leer y escribir en el repositorio
permissions:
  contents: read

jobs:
  test_and_build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # checkout repository
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -s python/src/requirements.txt ]; then pip install -r python/src/requirements.txt; fi
        if [ -s src/requirements.txt ]; then pip install -r src/requirements.txt; fi
    - name: Test with pytest
      working-directory: ./python/src
      run: pytest ./python/src/tests.py