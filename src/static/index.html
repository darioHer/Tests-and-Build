<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; }
    input { width: 4rem; }
    #resultado { font-weight: bold; margin-top: 1rem; }
    #flag-bloque[hidden], #multiplicar-bloque[hidden], #dividir-bloque[hidden], #potencia-bloque[hidden], #raiz-bloque[hidden] { display: none; }
    .fila { margin-top: 0.5rem; }
    #historial { padding-left: 1.2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Calculadora</h1>

  <div class="fila">
    <input id="a" type="number" value="5" /> +
    <input id="b" type="number" value="3" />
    <button id="btn-sumar">Sumar</button>
  </div>

  <!-- Resta: oculto por defecto; aparece si resta_enabled está encendido -->
  <div id="flag-bloque" hidden>
    <div class="fila">
      <input id="c" type="number" value="5" /> -
      <input id="d" type="number" value="3" />
      <button id="btn-restar">Restar</button>
    </div>
  </div>

  <!-- Multiplicación: oculto por defecto; expuesto detrás de toggle al 10% (Ticket 2) -->
  <div id="multiplicar-bloque" hidden>
    <div class="fila">
      <input id="e" type="number" value="4" /> ×
      <input id="f" type="number" value="3" />
      <button id="btn-multiplicar">Multiplicar</button>
    </div>
  </div>

  <!-- División: oculto por defecto; con manejo de división por cero y toggle al 100% (Ticket 3) -->
  <div id="dividir-bloque" hidden>
    <div class="fila">
      <input id="g" type="number" value="10" /> ÷
      <input id="h" type="number" value="2" />
      <button id="btn-dividir">Dividir</button>
    </div>
  </div>

  <!-- Oculto por defecto; solo aparece si el backend confirma que potencia_enabled está encendido -->
  <div id="potencia-bloque" hidden>
    <div class="fila">
      <input id="i" type="number" value="2" /> ^
      <input id="j" type="number" value="8" />
      <button id="btn-potencia">Potencia</button>
    </div>
  </div>

  <!-- Oculto por defecto; solo aparece si el backend confirma que raiz_enabled está encendido -->
  <div id="raiz-bloque" hidden>
    <div class="fila">
      √ <input id="k" type="number" value="9" />
      <button id="btn-raiz">Raíz cuadrada</button>
    </div>
  </div>

  <p id="resultado"></p>

  <h2>Historial</h2>
  <ul id="historial"></ul>

  <script src="script.js"></script>
</body>
</html>
