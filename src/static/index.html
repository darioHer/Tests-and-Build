<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; }
    input { width: 4rem; }
    #resultado { font-weight: bold; margin-top: 1rem; }
    #resta-bloque[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Calculadora</h1>

  <div>
    <input id="a" type="number" value="5" /> +
    <input id="b" type="number" value="3" />
    <button id="btn-sumar">Sumar</button>
  </div>

  <!-- Oculto por defecto; solo aparece si /api/resta responde que el flag está encendido -->
  <div id="resta-bloque" hidden>
    <input id="c" type="number" value="5" /> -
    <input id="d" type="number" value="3" />
    <button id="btn-restar">Restar</button>
  </div>

  <p id="resultado"></p>

  <script src="script.js"></script>
</body>
</html>
